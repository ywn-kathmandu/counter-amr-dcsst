<title>COUNTER-AMR DC-SST</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* Layout: phone-first app shell — sticky header, scrolling stage, bottom tab bar; widens to a 2-col reading grid past 900px. */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f5f6f8; --line:#d5d9e0; --line-soft:#e8eaef;
  --fg:#15181f; --fg-2:#474d5c; --fg-3:#5f6575;
  --accent:#1f47b8; --accent-soft:#eaefff; --accent-fg:#ffffff; --onbar:#ffffff;
  --access:#17683f; --access-bg:#e2f3e9;
  --watch:#8a5405; --watch-bg:#fdf0d8;
  --reserve:#a01338; --reserve-bg:#fce0e7;
  --notrec:#5f3f86; --notrec-bg:#efe6f8;
  --danger:#a8231c; --danger-bg:#fce3e1;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --font-cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --r:10px; --shadow:none;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* shell */
#shell{display:flex;flex-direction:column;height:100%;max-width:1180px;margin:0 auto;background:var(--bg)}
header#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);padding:9px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brandmark{display:flex;align-items:baseline;gap:7px;min-width:0}
.brandmark b{font-family:var(--font-cond);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.brandmark span{font-family:var(--font-mono);font-size:11.5px;color:var(--fg-3)}
.spacer{flex:1 1 auto}
.phasepill{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-cond);font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--line)}
.phasepill.silent{background:var(--surface-2);color:var(--fg-2)}
.phasepill.advisory{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
main{flex:1 1 auto;overflow-y:auto;padding:16px 16px 26px;-webkit-overflow-scrolling:touch}
nav#tabs{position:sticky;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:0 0 env(safe-area-inset-bottom,0px)}
nav#tabs button{padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--fg-3);font-family:var(--font-cond);font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-top:2px solid transparent;margin-top:-1px}
nav#tabs button[aria-selected="true"]{color:var(--accent);border-top-color:var(--accent)}
nav#tabs svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.eyebrow{font-family:var(--font-cond);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-size:19px;font-weight:600;letter-spacing:-.01em}
h2{font-size:15.5px;font-weight:600}
h3{font-size:13.5px;font-weight:600}
.muted{color:var(--fg-2);font-size:13.5px}
.tiny{color:var(--fg-3);font-size:12px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 16px;border-radius:9px;background:var(--surface);color:var(--fg);font-weight:500;font-size:14.5px;border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent;font-weight:600}
.btn.wide{width:100%}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:flex;gap:6px}
.seg button{flex:1 1 0;min-width:0;padding:12px 8px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;font-size:14px;text-align:center}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:13.5px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-family:var(--font-cond);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.b-Access{background:var(--access-bg);color:var(--access)}
.b-Watch{background:var(--watch-bg);color:var(--watch)}
.b-Reserve{background:var(--reserve-bg);color:var(--reserve)}
.b-Notrecommended{background:var(--notrec-bg);color:var(--notrec)}
.b-Unverified{background:var(--accent-soft);color:var(--accent)}
.b-Needspaneldecision{background:var(--surface-2);color:var(--fg-2);border:1px solid var(--line)}
.b-Unclassified{background:var(--surface-2);color:var(--fg-2);border:1px solid var(--line)}
.b-Antituberculosis{background:var(--notrec-bg);color:var(--notrec)}
.b-Unknown{background:var(--surface-2);color:var(--fg-2)}
.b-vet{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent)}
#protobar{flex:none;padding:5px 14px;background:var(--watch-bg);color:var(--watch);
  font-family:var(--font-cond);font-size:11.5px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;text-align:center;border-bottom:1px solid var(--line)}
.orient{border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:11px;padding:13px 15px}
.orient h3{margin:0 0 7px}
.orient ol{margin:0;padding-left:19px}
.orient li{margin:4px 0;font-size:13.5px;line-height:1.5}
label.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer}
label.check input{margin:2px 0 0;width:18px;height:18px;flex:none;accent-color:var(--accent)}
label.check.on{border-color:var(--accent);background:var(--accent-soft)}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface)}
input[type=search]{font-size:16px}
hr.sep{border:none;border-top:1px solid var(--line-soft);margin:2px 0}

/* search */
.searchwrap{position:relative}
.results{margin-top:8px;display:flex;flex-direction:column;gap:1px;background:var(--line-soft);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.results button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 13px;background:var(--surface)}
.results button:hover,.results button:focus-visible{background:var(--surface-2)}
.rname{font-weight:600;font-size:14.5px}
.rgen{font-size:13px;color:var(--fg-2)}

/* prompt card */
.prompt{border-radius:var(--r);padding:14px;border:1.5px solid}
.prompt.info{background:var(--accent-soft);border-color:var(--accent)}
.prompt.warn{background:var(--watch-bg);border-color:var(--watch)}
.prompt.stop{background:var(--danger-bg);border-color:var(--danger)}
.prompt h3{font-size:15px;margin-bottom:5px}
.prompt ul{margin:7px 0 0;padding-left:18px;font-size:13.5px}
.prompt li{margin:3px 0}

/* stats + charts */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
.tile .v{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:23px;font-weight:600;line-height:1.15;letter-spacing:-.02em}
.tile .l{font-family:var(--font-cond);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);margin-top:3px}
.tile .s{font-size:12.5px;color:var(--fg-2);margin-top:5px}
.stackbar{display:flex;height:30px;border-radius:7px;overflow:hidden;border:1px solid var(--line-soft)}
.stackbar div{display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11.5px;font-weight:600;color:var(--onbar);min-width:0;overflow:hidden}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--fg-2)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-family:var(--font-cond);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-3);padding:7px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line-soft);vertical-align:top}
td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tablewrap{overflow-x:auto}
.meter{height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* misc */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.note{border-left:3px solid var(--accent);background:var(--surface-2);padding:10px 13px;border-radius:0 8px 8px 0;font-size:13px;color:var(--fg-2)}
.note.warn{border-left-color:var(--watch)}
details.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
details.acc summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";font-family:var(--font-mono);color:var(--fg-3);font-size:17px;flex:none}
details.acc[open] summary::after{content:"–"}
details.acc .body{margin-top:10px;font-size:13px;color:var(--fg-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12.5px}
.kv dt{color:var(--fg-3);font-family:var(--font-cond);letter-spacing:.04em;text-transform:uppercase;font-size:12px;padding-top:1px}
.kv dd{margin:0;font-family:var(--font-mono);font-size:12.5px;overflow-wrap:anywhere}
.script{display:inline-block;font-size:13.5px;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:6px;margin-top:4px}
.pathtag{font-family:var(--font-cond);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:5px;background:var(--surface-2);color:var(--fg-2)}
.ok{color:var(--access)} .no{color:var(--danger)} .na{color:var(--fg-3)}
@media(min-width:900px){
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .cols>*{min-width:0}
}
</style>

<div id="shell">
  <header id="top">
    <div class="brandmark"><b>DC&#8209;SST</b><span id="phId">PH&#8209;00</span></div>
    <div class="spacer"></div>
    <button id="phaseBtn" class="phasepill silent"><i class="dot"></i><span id="phaseTxt">Silent</span></button>
  </header>
  <div id="protobar">Research prototype &middot; TDR&nbsp;CA26-0034 &middot; sample data &middot; not for clinical use</div>
  <main id="stage"></main>
  <nav id="tabs" role="tablist"></nav>
</div>

<script>
/* ============================================================
   COUNTER-AMR Nepal — DC-SST prototype
   Functions: 1 Identify · 2 Advise · 3 Refer · 4 Record
   Prototype for TDR CA26-0034. Not for clinical use.
   ============================================================ */
/* BUILD is replaced at build time. 'demo' is the public evaluator build: it seeds
   example traffic and lets the phase be switched so a reviewer can see both states.
   'field' is what goes to a pharmacy: no seeded data, and the phase is fixed by the
   cluster's activation date rather than by anyone at the counter. */
const BUILD = /*BUILD_MODE*/'demo';
const FIELD = BUILD === 'field';
const AWARE = /*AWARE_DATA*/[];
const BRANDS = /*BRAND_DATA*/[];
const NONAB = /*NONAB_DATA*/[];   // every other registered product, so 'is this an antibiotic?' has a real answer

const VERSIONS = {
  app:'0.10.0-prototype',
  map:'NP-DDA v1 enriched · 16,831 products · 2,869 antibiotic',
  aware:'WHO AWaRe 2025 — 376 entries',
  prompts:'PL-2026.10 rev 5 — draft, panel sign-off pending',
  engine:'scoring-engine 2.0 · three-state components, unassessed never counted as concordant'
};

/* ---- prompt library: every string versioned + logged by id ---- */
const PROMPTS = {
  'P-A1':{t:'Access antibiotic',b:['First-line group. Dispense the full course as prescribed.','Confirm the customer knows the total number of days.']},
  'P-W1':{t:'Watch antibiotic',b:['Higher resistance potential — conserve where an Access option is appropriate.','If a clinician prescribed this, dispense it. Do not substitute on AWaRe group alone.']},
  'P-R1':{t:'Reserve antibiotic',b:['Last-resort group, intended for hospital use.','Refer to a clinician or hospital pharmacy before dispensing.']},
  'P-N1':{t:'Not-recommended combination',b:['This fixed-dose combination is not recommended by WHO.','A single-molecule alternative is usually available — refer to a clinician.']},
  'P-NP1':{t:'No prescription presented',b:['Record the reason for the request and screen for red flags before dispensing.','Antibiotics normally require a prescription.']},
  'P-RF1':{t:'Red flag present — refer',b:['This presentation needs a clinician, not an antibiotic from the counter.','Offer the referral slip and note where the customer can be seen today.']},
  'P-SH1':{t:'Short course',b:['The quantity entered is below a usual treatment course.','Partial courses drive resistance. Offer the full course or refer.']},
  'P-CH1':{t:'Child under 2',b:['Screen carefully and refer rather than dispense on request.','Dosing in this age group is weight-based.']},
  'P-FQ1':{t:'Fluoroquinolone caution',b:['Avoid in under-18s and in pregnancy unless a clinician has prescribed it.','Ask about tendon problems and prior reactions.']},
  'P-PG1':{t:'Pregnancy',b:['Several antibiotic classes are unsuitable in pregnancy.','Refer to a clinician before dispensing.']},
  'P-UV1':{t:'Product not yet in the register',b:['This product was added at the counter and has not been checked by the research team.','Read the strip carefully and treat it as higher risk until it is confirmed.']},
  'P-U1':{t:'Not classified by AWaRe',b:['This product is a combination the WHO classification does not cover.','Treat as higher risk until the review panel rules on it, and prefer a single-molecule alternative.']},
  'P-TB1':{t:'Antituberculosis drug',b:['TB treatment is supervised through the national programme, not dispensed course by course over the counter.','Single-drug or part-course TB treatment is how resistant TB develops.','Refer the person to the nearest DOTS centre.']},
  'P-VT1':{t:'Veterinary antibiotic',b:['This product is registered for animal use.','If it is being bought for a person, refer them to a prescriber instead.','Record the sale either way so the study can count it.']},
  'P-CO1':{t:'Counselling',b:['Complete the full course even after symptoms improve.','Return if no better in 48–72 hours, or sooner if worse.']}
};

/* ---- indication chips + red-flag screen (panel-reviewed placeholders) ---- */
const INDICATIONS = [
  {id:'resp',   l:'Cough / cold',      np:'Rugha, khoki'},
  {id:'fever',  l:'Fever',             np:'Jworo'},
  {id:'throat', l:'Sore throat',       np:'Ghaanti dukheko'},
  {id:'diarr',  l:'Loose motion',      np:'Disa laageko'},
  {id:'stomach',l:'Stomach pain',      np:'Pet dukheko'},
  {id:'urine',  l:'Urine problem',     np:'Pisab poleko'},
  {id:'skin',   l:'Skin / wound',      np:'Ghau, chala'},
  {id:'dental', l:'Toothache',         np:'Daat dukheko'},
  {id:'eyeear', l:'Eye / ear',         np:'Aankha, kaan'},
  {id:'repeat', l:'Same as last time', np:'Aghi kai aushadhi'},
  {id:'other',  l:'Something else',    np:''}
];
const REDFLAGS = [
  {id:'rf1',l:'Fever more than 3 days, or fever with rash'},
  {id:'rf2',l:'Breathlessness, chest pain, or very fast breathing'},
  {id:'rf3',l:'Blood in stool or vomit, or signs of dehydration'},
  {id:'rf4',l:'Difficulty swallowing, drooling, or neck swelling'},
  {id:'rf5',l:'Not improving after a previous antibiotic course'},
  {id:'rf6',l:'Pregnant, or a child under 2 years'},
  {id:'rf7',l:'Diabetes with a foot wound, or a spreading wound'}
];
const AGEBANDS=['<2','2–11','12–17','18–44','45–64','65+'];
const SEXES=['Female','Male','Not stated'];

/* ---- state ---- */
const DEF_CFG={pharmacyId:'PH-07',cluster:'C3',step:2,phase:'silent',activated:'',seeded:false,staffCode:'S-02',studyStart:'',stock:[]};
let cfg={...DEF_CFG}, tx=[], adverse=[], unresolved=[], provisional=[], searches=[];
let tab='counter', lastView='';
let draft=null, t0=0, lookupMs=0;

const LS='dcsst.v1';
function save(){ try{ localStorage.setItem(LS,JSON.stringify({cfg,tx,adverse,unresolved,provisional,searches:searches.slice(-800)})); }
  catch(e){ try{ localStorage.setItem(LS,JSON.stringify({cfg,tx,adverse,unresolved,
    provisional:provisional.map(x=>({...x,photo:null}))})); toast('Storage full — photos dropped'); }catch(e2){} } }
function load(){ try{ const r=localStorage.getItem(LS); if(!r) return false;
  const d=JSON.parse(r); cfg={...DEF_CFG,...(d.cfg||{})}; tx=d.tx||[]; adverse=d.adverse||[]; unresolved=d.unresolved||[]; provisional=d.provisional||[]; searches=d.searches||[]; return true;
}catch(e){ return false } }

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const groupKey=g=>'b-'+String(g||'Unknown').replace(/[^A-Za-z]/g,'');
const groupLabel=g=>g==='Needs panel decision'?'Panel review':(g==='Antituberculosis'?'TB drug':g);
const pct=(n,d)=>d? Math.round(n/d*100):0;
function toast(msg){ const el=document.createElement('div'); el.className='toast'; el.textContent=msg; document.body.appendChild(el);
  setTimeout(()=>el.remove(),2300); }

/* ---- FUNCTION 1 — Identify: brand → generic → AWaRe ---- */
const AW_BY_NAME={}; AWARE.forEach(a=>AW_BY_NAME[a.n.toLowerCase()]=a);
function awareOf(generic){ return AW_BY_NAME[String(generic).toLowerCase()] || null; }

/* Counter staff type what is printed on the strip: caps, hyphens, no spaces,
   a strength suffix, or a slip of the finger. Normalise both sides to
   alphanumerics, then widen in tiers, cheapest first. */
const FORMWORDS=/\b(tab|tabs|tablet|tablets|cap|caps|capsule|capsules|inj|injection|syrup|syp|susp|suspension|drops?|dry|ds|dt|df|forte|plus|gel|cream|ointment|eye|ear|ml|gm|mg|mcg)\b/g;
const norm=t=>String(t).toLowerCase().replace(/[^a-z0-9]+/g,'');
const stripUnits=q=>q.replace(/(mg|mcg|ml|gm|g)$/,'');
BRANDS.forEach(b=>{ b._n=norm(b.b); b._c=norm(String(b.b).toLowerCase().replace(FORMWORDS,'')); b._g=norm(b.g);
  b._a=(b._c.match(/^[a-z]+/)||[b._c])[0]; });   // brand word without the strength, for typo matching
AWARE.forEach(a=>{ a._n=norm(a.n); });
NONAB.forEach(b=>{ b._n=norm(b.b); });

function lev(a,b,max){                       // bounded edit distance
  if(Math.abs(a.length-b.length)>max) return max+1;
  let prev=Array.from({length:b.length+1},(_,i)=>i), cur=new Array(b.length+1);
  for(let i=1;i<=a.length;i++){
    cur[0]=i; let best=i;
    for(let j=1;j<=b.length;j++){
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
      if(cur[j]<best) best=cur[j];
    }
    if(best>max) return max+1;
    [prev,cur]=[cur,prev];
  }
  return prev[b.length];
}

function lookupOther(qRaw){
  const q=stripUnits(norm(qRaw));
  if(q.length<3) return [];
  const out=[];
  for(const b of NONAB){
    if(b._n.startsWith(q)) out.push({...b,rank:0});
    else if(b._n.includes(q)) out.push({...b,rank:1});
    if(out.length>40) break;
  }
  out.sort((x,y)=>x.rank-y.rank || x.b.length-y.b.length);
  return out.slice(0,5);
}

function lookup(qRaw){
  const t=performance.now();
  const q=stripUnits(norm(qRaw));
  if(q.length<3){ lookupMs=0; return []; }
  const hits=[], seen=new Set();
  for(const v of provisional){                               // added at this counter, not yet adjudicated
    if(v.status==='rejected') continue;
    if(norm(v.brand).includes(q)) hits.push({kind:'brand',brand:v.brand,generic:v.generic||'',group:'Unverified',
      strength:v.strength||'',form:v.form||'',rank:0,provisional:true,pid:v.id});
  }
  const add=(b,rank,fuzzy)=>{
    const k=b.b+'|'+(b.s||'')+'|'+(b.f||'');
    if(seen.has(k)) return; seen.add(k);
    hits.push({kind:'brand',brand:b.b,generic:b.g,group:b.a,strength:b.s||'',form:b.f||'',rank,fuzzy:!!fuzzy,vet:!!b.v});
  };
  for(const b of BRANDS){
    if(b._n.startsWith(q)||b._c.startsWith(q)) add(b,0);
    else if(b._n.includes(q)||b._c.includes(q)) add(b,1);
    else if(b._n.length>=5 && q.includes(b._n)) add(b,2);   // "azixon250mg" typed for "Azixon 250"
    else if(b._g.includes(q)) add(b,4);                      // searching by generic
  }
  for(const a of AWARE){
    if(a._n.startsWith(q)) hits.push({kind:'generic',brand:'',generic:a.n,group:a.g,strength:'',form:'',rank:3});
    else if(a._n.includes(q)) hits.push({kind:'generic',brand:'',generic:a.n,group:a.g,strength:'',form:'',rank:5});
  }
  if(!hits.length && q.length>=4){                           // typo fallback, flagged in the UI
    const qa=(q.match(/^[a-z]+/)||[q])[0], max=qa.length<=6?1:2;
    for(const b of BRANDS){
      if(!b._a || Math.abs(b._a.length-qa.length)>max) continue;
      if(lev(qa, b._a, max)<=max) add(b,6,true);
      if(hits.length>=6) break;
    }
  }
  hits.sort((x,y)=>x.rank-y.rank || (x.brand||x.generic).length-(y.brand||y.generic).length);
  lookupMs=Math.round((performance.now()-t)*10)/10;
  return hits.slice(0,8);
}

/* ---- Same-molecule equivalents.
   A factual lookup: this brand is this molecule, these other brands are the same
   molecule. The tool never proposes a DIFFERENT molecule for a complaint — that
   is a clinical decision and belongs with a prescriber. ---- */
function equivalents(generic, excludeBrand){
  if(!generic) return {stocked:[],other:[]};
  const g=String(generic).toLowerCase(), stock=new Set((cfg.stock||[]).map(x=>x.toLowerCase()));
  const seen=new Set(), stocked=[], other=[];
  for(const b of BRANDS){
    if(String(b.g).toLowerCase()!==g) continue;
    const key=b.b+'|'+(b.s||'');
    if(seen.has(key)||b.b===excludeBrand) continue;
    seen.add(key);
    (stock.has(b.b.toLowerCase())?stocked:other).push(b);
  }
  return {stocked, other:other.slice(0,14), total:stocked.length+other.length};
}

/* ---- safety rules (physician-reviewed placeholders; panel sign-off pending) ---- */
function riskFlags(d){
  const f=[], g=d.awareGroup, gen=(d.generic||'').toLowerCase();
  if(g==='Reserve') f.push({id:'HR-RES',p:'P-R1',sev:'stop',l:'Reserve-group antibiotic'});
  if(g==='Not recommended') f.push({id:'HR-NRC',p:'P-N1',sev:'stop',l:'Not-recommended fixed-dose combination'});
  if(g==='Needs panel decision'||g==='Unclassified') f.push({id:'HR-UNC',p:'P-U1',sev:'warn',l:'Combination not classified by AWaRe'});
  if(g==='Antituberculosis') f.push({id:'HR-TB',p:'P-TB1',sev:'stop',l:'Antituberculosis drug — programme-supervised treatment'});
  if(d.vet) f.push({id:'HR-VET',p:'P-VT1',sev:'warn',l:'Veterinary antibiotic'});
  if(g==='Unverified') f.push({id:'HR-UNV',p:'P-UV1',sev:'warn',l:'Product not yet verified by the research team'});
  if(/floxacin/.test(gen) && ['<2','2–11','12–17'].includes(d.ageBand)) f.push({id:'HR-FQ',p:'P-FQ1',sev:'warn',l:'Fluoroquinolone in a person under 18'});
  if(d.ageBand==='<2') f.push({id:'HR-U2',p:'P-CH1',sev:'warn',l:'Child under 2 years'});
  if(d.pregnant) f.push({id:'HR-PRG',p:'P-PG1',sev:'warn',l:'Pregnancy'});
  if(d.qty && d.qty<6 && /tab|cap/i.test(d.form||'tab')) f.push({id:'HR-SHC',p:'P-SH1',sev:'warn',l:'Quantity below a usual course'});
  return f;
}
function buildPrompt(d){
  const flags=riskFlags(d), ids=[];
  let sev='info';
  const blocks=[];
  const gp={'Access':'P-A1','Watch':'P-W1','Reserve':'P-R1','Not recommended':'P-N1'}[d.awareGroup];
  if(gp){ blocks.push(gp); }
  if(!d.rx) blocks.push('P-NP1');
  if(d.redFlags && d.redFlags.length){ blocks.push('P-RF1'); sev='stop'; }
  flags.forEach(f=>{ blocks.push(f.p); if(f.sev==='stop') sev='stop'; else if(sev==='info') sev='warn'; });
  if(!d.counselDays) blocks.push('P-CO1');
  const seen=new Set(), out=[];
  blocks.forEach(id=>{ if(!seen.has(id)&&PROMPTS[id]){ seen.add(id); ids.push(id); out.push({id,...PROMPTS[id]}); } });
  return {sev,ids,items:out,flags};
}

/* ---- primary outcome: pathway-specific stewardship concordance ---- */
/* Each component is yes | no | na | unassessed.
   na         = not applicable to this pathway or encounter.
   unassessed = applicable, but not recorded at the counter.
   An encounter is concordant only when every applicable component is yes.
   One "no" makes it discordant. A missing assessment makes it neither: the
   outcome is left empty rather than silently counted as concordant. */
const Y='yes', N='no', NA='na', UN='unassessed';
const yn = v => v===true ? Y : v===false ? N : UN;          // boolean, unrecorded -> unassessed
const tick = v => v ? Y : N;                                 // a checkbox is always answered
const match3 = v => v==='yes' ? Y : v==='no' ? N : v==='na' ? NA : UN;

/* PRIMARY ENDPOINT - COUNTER-AMR Nepal, frozen 12 October 2026.
   Population: non-prescription antibiotic encounters. That is the problem under
   study: the counter where no prescription arrives and an antibiotic is handed
   over anyway.
   Unit: the encounter, including those ending in referral or non-dispensing.
   Concordant when all four hold:
     1  reason for the request recorded
     2  red-flag screening performed
     3  referral made where a red flag was present      (na if none present)
     4  duration advice AND safety-net advice given     (na if nothing dispensed)
   Deliberately excluded: product identification (tool performance, near ceiling)
   and dosing advice (near universal at baseline). AWaRe group is NOT a component:
   the tool never substitutes a molecule, so it must not be judged on doing so.
   Any component 'no' -> 0. All applicable 'yes' -> 1. Otherwise unscorable. */
const PRIMARY_VERSION = 'PO-2026.10.12';
function primaryOutcome(d){
  if(d.rx) return {eligible:false, met:null, nUnass:0};
  const dispensed = d.action==='dispensed' || d.action==='changed';
  const c = {
    indicationCaptured: tick((d.inds||[]).length>0),
    redFlagScreened:    yn(d.screened),
    referredIfFlag:     !(d.redFlags && d.redFlags.length) ? NA : tick(d.referred===true),
    durationGiven:      dispensed ? tick(!!d.counselDays) : NA,
    safetyNetGiven:     dispensed ? tick(!!d.safetyNet)   : NA
  };
  const v = Object.values(c);
  const nUnass = v.filter(x=>x===UN).length;
  return {eligible:true, met: v.includes(N) ? false : (nUnass ? null : true), nUnass, parts:c};
}

function concordance(d){
  const c={};
  c.identified = tick(!!d.generic && d.awareGroup!=='Unknown');
  const dispensed = d.action==='dispensed' || d.action==='changed';

  if(d.rx){
    c.pathway='prescription';
    c.rxConcordant   = yn(d.rxMatch);
    c.strengthMatched= match3(d.strengthMatch);
    c.formMatched    = match3(d.formMatch);
    c.quantityAssessed= match3(d.qtyMatch);
  }else{
    c.pathway='non-prescription';
    c.indicationCaptured = tick((d.inds||[]).length>0);
    c.redFlagScreened    = yn(d.screened);
    c.referredIfFlag     = !(d.redFlags && d.redFlags.length) ? NA : tick(d.referred===true);
  }

  // counselling applies only where something was handed over
  if(dispensed){
    c.doseGiven      = tick(!!d.counselDose);
    c.durationGiven  = tick(!!d.counselDays);
    c.safetyNetGiven = tick(!!d.safetyNet);
  }else{
    c.doseGiven = c.durationGiven = c.safetyNetGiven = NA;
  }

  const hs = d.hasStop===true ? true : d.hasStop===false ? false : null;
  c.safetyHandled = hs===null ? UN : tick(!hs || !dispensed);

  const vals = Object.keys(c).filter(k=>k!=='pathway').map(k=>c[k]);
  c.anyFail   = vals.includes(N);
  c.anyUnass  = vals.includes(UN);
  c.nUnass    = vals.filter(v=>v===UN).length;
  // met: true | false | null (null = cannot be scored, exported as an empty cell)
  c.met = c.anyFail ? false : (c.anyUnass ? null : true);
  return c;
}

/* ---- DDD (illustrative only; not part of the primary outcome) ---- */
const DDD={'amoxicillin':1.5,'amoxicillin + clavulanic acid':1.5,'azithromycin':0.3,'ciprofloxacin':1,'cefixime':0.4,
 'ceftriaxone':2,'metronidazole':1.5,'levofloxacin':0.5,'cefuroxime':0.5,'doxycycline':0.1,'ofloxacin':0.4,
 'cefpodoxime':0.4,'clarithromycin':0.5,'norfloxacin':0.8,'cephalexin':2,'cefalexin':2,'erythromycin':1,'linezolid':1.2,
 'sulfamethoxazole + trimethoprim':1.92,'nitrofurantoin':0.2,'cloxacillin':2,'cefadroxil':2};
function dddOf(t){ const d=DDD[String(t.generic).toLowerCase()]; if(!d||!t.qty||!t.strengthMg) return 0;
  return Math.round((t.qty*t.strengthMg/1000)/d*100)/100; }

/* Every lookup is logged, resolved or not. Without this, a search that fails
   and is abandoned leaves no trace, and lookup success cannot be computed. */
function logSearch(q, hits, outcome){
  if(!q || q.length<3) return;
  const last=searches[searches.length-1];
  if(last && last.o==='typing' && q.startsWith(last.q)) searches.pop();   // keep the final form of a query
  searches.push({ts:new Date().toISOString(), ph:cfg.pharmacyId, staff:cfg.staffCode, phase:cfg.phase,
    q, n:hits, ms:lookupMs, o:outcome});
  if(outcome!=='typing') save();
}

function startDraft(h){
  const a=h.generic?awareOf(h.generic):null;
  const grp=h.group || (a?a.g:'Unknown');
  const pre={rx:draft?draft.rx:null, inds:(draft&&draft.inds)||[], indOther:(draft&&draft.indOther)||'',
    encId:(draft&&draft.encId)||('E'+Date.now().toString(36).toUpperCase()), seq:(draft&&draft.seq)||1,
    carry:(draft&&draft.carry)||null};
  t0=t0||performance.now();
  draft={stage:'capture',brand:h.brand||'',generic:h.generic||'',strength:h.strength||'',form:h.form||'tablet',
    awareGroup:grp, eml:a?a.e:'', lookupMs, vet:!!h.vet,
    encId:pre.encId, seq:pre.seq,
    rx:pre.rx,rxMatch:null,strengthMatch:null,formMatch:null,qtyMatch:null,qty:'',inds:pre.inds.slice(),indOther:pre.indOther,
    askedSymptoms:false,screened:false,redFlags:[],
    pregnant:false,ageBand:'',sex:'',counselDose:false,counselDays:false,safetyNet:false,referred:false,
    action:null,unresolved:h.kind==='unresolved',
    ...(pre.carry||{})};   // a second medicine for the same customer inherits the shared answers
  render();
}

  return `<div class="stack-s">
    <span class="pathtag">Pathway B · no prescription</span>
    <div class="row" style="justify-content:space-between">
      <span class="muted" style="min-width:0">Reason: <b>${names.length?esc(names.join(', ')):'not recorded'}</b></span>

function equivPanel(generic, exclude){
  const e=equivalents(generic, exclude);
  if(!e.total) return '';
  const row=b=>`<div class="row" style="justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line-soft)">
    <span style="min-width:0;font-size:14px">${esc(b.b)}</span>
    <span class="tiny mono" style="white-space:nowrap">${esc(b.s||'')} ${esc(b.f||'')}</span></div>`;
  return `<details class="acc"><summary>Same medicine, other brands <span class="tiny mono">${e.total}</span></summary>
    <div class="body">
      ${e.stocked.length?`<div class="eyebrow" style="color:var(--access)">On your shelf</div>${e.stocked.map(row).join('')}`:''}
      ${e.other.length?`<div class="eyebrow" style="margin-top:${e.stocked.length?'12px':'0'}">Registered in Nepal</div>${e.other.map(row).join('')}`:''}
      <p class="tiny" style="margin:11px 0 0">Same molecule as ${esc(generic)}. Check strength and form against what the customer needs. The tool never suggests a different medicine for a complaint — that is for a prescriber.</p>
      ${!(cfg.stock||[]).length?`<p class="tiny" style="margin:7px 0 0">Mark what this shop stocks in Setup and your own brands appear first.</p>`:''}
    </div></details>`;
}

function counselBlock(d){
  /* Ready-made sentences the pharmacist can read out. Deliberately generic:
     none of them names a drug, a dose or a number of days, because that is a
     prescribing decision. The tool records whether each was actually used.
     In the baseline the three tick boxes remain - they are the measurement -
     but every instructional label is replaced by a neutral description of what
     is being recorded, so the baseline does not teach what it is measuring. */
  const adv = cfg.phase==='advisory';
  return `<hr class="sep">
  <div class="stack-s">
    <div class="eyebrow">At handover &mdash; what was said</div>
    <label class="check ${d.counselDose?'on':''}"><input type="checkbox" id="cdose" ${d.counselDose?'checked':''}>
      <span><b>How to take it</b><br><span class="tiny">${adv?'The 0&#8209;1&#8209;0 or 1&#8209;1&#8209;1 grid &mdash; times per day.':'Whether the dosing was said.'}</span></span></label>

    <label class="check ${d.counselDays?'on':''}"><input type="checkbox" id="cdays" ${d.counselDays?'checked':''}>
      <span><b>${adv?'How many days, and finish the course':'How many days'}</b>
        ${cfg.phase==='advisory'?`<br><span class="script">&ldquo;Aushadhi pura khanuhos, niko bhaye pani.&rdquo;</span>`:''}
        <br><span class="tiny">${adv?'Finish all of them, even if you feel better. Say the number of days as well.':'Whether the number of days was said.'}</span></span></label>

    <label class="check ${d.safetyNet?'on':''}"><input type="checkbox" id="cnet" ${d.safetyNet?'checked':''}>
      <span><b>When to come back</b>
        ${cfg.phase==='advisory'?`<br><span class="script">&ldquo;Tin din ma niko bhaena bhane doctor kaha jaanuhos.&rdquo;</span>`:''}
        <br><span class="tiny">${adv?'If you are not better in three days, see a doctor. Sooner if worse.':'Whether advice to come back was given.'}</span></span></label>
    <p class="tiny" style="margin:2px 0 0">Tick only what was actually said.${cfg.phase==='advisory'?' The wording is a suggestion, not a script you must follow.':''}</p>
  </div>`;
}

function submitDraft(){
  const d=draft;
  d.secs=Math.round((performance.now()-t0)/100)/10;
  const p=buildPrompt(d);
  d.hasStop = p.sev==='stop';
  d.promptIds=p.ids; d.promptSev=p.sev; d.flags=p.flags.map(f=>f.id);
  if(cfg.phase==='advisory'){ d.stage='prompt'; }
  else { d.promptIds=[]; d.promptSev='silent'; d.stage='outcome'; }   // ask, never assume
  render();
}

   and a baseline referral would be invisible. No prompts, no groups, no scripts. */

    screened:d.screened, askedSymptoms:!!d.askedSymptoms, redFlags:d.redFlags.slice(), counselDose:!!d.counselDose, counselDays:!!d.counselDays, safetyNet:!!d.safetyNet, referred:d.referred, action:d.action,
    ageBand:d.ageBand, sex:d.sex, flags:d.flags||[], prompts:d.promptIds||[], secs:d.secs||0, lookupMs:d.lookupMs,
    unresolved:!!d.unresolved||d.awareGroup==='Unverified', provisionalId:d.provisionalId||'', path:c.pathway, conc:c.met, comp:c, prim:primaryOutcome(d)};

/* ---------- SURVEILLANCE ---------- */
function viewSurv(s){
  const sil=tx.filter(t=>t.phase==='silent'), adv=tx.filter(t=>t.phase==='advisory');
  const cnt=g=>tx.filter(t=>t.aware===g).length;
  const groups=['Access','Watch','Reserve','Not recommended'];
  const colors={'Access':'var(--access)','Watch':'var(--watch)','Reserve':'var(--reserve)','Not recommended':'var(--notrec)'};
  const known=groups.reduce((a,g)=>a+cnt(g),0)||1;
  const access=pct(cnt('Access'),known);
  const noRx=pct(tx.filter(t=>t.rx===false).length,tx.length||1);
  const unres=pct(tx.filter(t=>t.unresolved).length,tx.length||1);
  const medSecs=(()=>{const v=tx.map(t=>t.secs).filter(Boolean).sort((a,b)=>a-b);return v.length?v[Math.floor(v.length/2)]:0})();
  // complete-case: encounters that could not be scored are excluded from the denominator
  const scored=a=>a.filter(t=>t.conc===true||t.conc===false);
  const concOf=a=>{const s=scored(a); return s.length?pct(s.filter(t=>t.conc===true).length,s.length):null;};
  // primary endpoint: eligible, scorable, non-prescription encounters only
  const primOf=a=>{
    const e=a.filter(t=>t.prim&&t.prim.eligible&&(t.prim.met===true||t.prim.met===false));
    return {n:e.length, pct:e.length?pct(e.filter(t=>t.prim.met===true).length,e.length):null};
  };
  const mols={};
  tx.forEach(t=>{ if(!t.generic) return; const k=t.generic; mols[k]=mols[k]||{n:0,g:t.aware,ddd:0}; mols[k].n++; mols[k].ddd+=dddOf(t); });
  const top=Object.entries(mols).sort((a,b)=>b[1].n-a[1].n).slice(0,8);

  s.innerHTML=`<div class="stack">
    <div><h1>Surveillance</h1><p class="muted" style="margin:3px 0 0">${tx.length} antibiotic sales · ${cfg.pharmacyId}, cluster ${cfg.cluster}</p></div>
    ${demoNotice()}
    <div class="tiles">
      <div class="tile"><div class="v">${access}%</div><div class="l">Access share</div><div class="s">Target ≥70% by 2030</div></div>
      <div class="tile"><div class="v">${noRx}%</div><div class="l">No prescription</div><div class="s">Secondary indicator</div></div>
      <div class="tile"><div class="v">${medSecs}s</div><div class="l">Median entry</div><div class="s">UAT threshold 30s</div></div>
      <div class="tile"><div class="v">${unres}%</div><div class="l">Unresolved brand</div><div class="s">${unresolved.length} queued</div></div>
    </div>

    <div class="card">
      <div class="eyebrow">AWaRe distribution</div>
      <div class="stackbar" style="margin:9px 0 8px">
        ${groups.map(g=>{const p=pct(cnt(g),known); return p?`<div style="width:${p}%;background:${colors[g]}" title="${g} ${p}%">${p>=9?p+'%':''}</div>`:''}).join('')}
      </div>
      <div class="legend">${groups.map(g=>`<span><i style="background:${colors[g]}"></i>${g} ${cnt(g)}</span>`).join('')}</div>
      <p class="tiny" style="margin:9px 0 0">Dispensing, not consumption. No catchment denominator, so this is not a population consumption rate.</p>
    </div>

    <div class="cols">
      <div class="card">
        <div class="eyebrow">Primary outcome &middot; non-prescription encounters</div>
        <div class="stack-s" style="margin-top:9px">
          ${[['Silent phase',primOf(sil)],['Advisory phase',primOf(adv)]].map(([l,o])=>`
            <div><div class="row" style="justify-content:space-between"><span style="font-size:13px">${l}</span>
              <span class="mono" style="font-size:13px;font-weight:600">${o.pct===null?'—':o.pct+'%'} <span class="tiny">n=${o.n}</span></span></div>
              <div class="meter" style="margin-top:4px"><i style="width:${o.pct||0}%"></i></div></div>`).join('')}
        </div>
        <p class="tiny" style="margin:10px 0 0">Non-prescription encounters that met all four criteria: reason recorded, red flags screened, referral where a flag was present, duration and safety-net advice given. Complete cases. ${PRIMARY_VERSION}, panel sign-off pending.</p>
      </div>
      <div class="card">
        <div class="eyebrow">By pathway</div>
        <div class="tablewrap" style="margin-top:7px"><table><thead><tr><th>Pathway</th><th class="num">n</th><th class="num">Concordant</th></tr></thead><tbody>
          ${['prescription','non-prescription'].map(p=>{const a=tx.filter(t=>t.path===p);
            const sc=scored(a);
            return `<tr><td>${p}</td><td class="num">${a.length}</td><td class="num">${sc.length?pct(sc.filter(t=>t.conc===true).length,sc.length)+'%':'—'}</td></tr>`}).join('')}
        </tbody></table></div>
      </div>
    </div>

    <div class="card">
      <div class="eyebrow">Most dispensed molecules</div>
      <div class="tablewrap" style="margin-top:7px"><table>
        <thead><tr><th>Molecule</th><th>AWaRe</th><th class="num">Tx</th><th class="num">DDD</th></tr></thead>
        <tbody>${top.length?top.map(([k,v])=>`<tr><td>${esc(k)}</td><td><span class="badge ${groupKey(v.g)}">${esc(groupLabel(v.g))}</span></td><td class="num">${v.n}</td><td class="num">${v.ddd?v.ddd.toFixed(1):'—'}</td></tr>`).join('')
          :'<tr><td colspan="4" class="muted">No data yet</td></tr>'}</tbody></table></div>
      <p class="tiny" style="margin:9px 0 0">DDD shown where the molecule has a mapped value; illustrative only, and not part of the primary outcome.</p>
    </div>
  </div>`;
}

  if(stq) stq.addEventListener('input',()=>{
    const q=norm(stq.value);
    if(q.length<3){ stres.innerHTML=''; return; }
    const seen=new Set(), hits=[];
    for(const b of BRANDS){ if((b._n.includes(q)||b._c.includes(q)) && !seen.has(b.b)){ seen.add(b.b); hits.push(b); } if(hits.length>=6) break; }
    stres.innerHTML = hits.length?`<div class="results" style="margin-top:7px">${hits.map((b,i)=>
      `<button data-add="${i}"><span style="flex:1;min-width:0"><span class="rname">${esc(b.b)}</span>
      <span class="rgen"> · ${esc(b.g)}${b.s?' · '+esc(b.s):''}</span></span>
      <span class="badge ${groupKey(b.a)}">${esc(groupLabel(b.a))}</span></button>`).join('')}</div>`
      :'<div class="tiny" style="margin-top:7px">No match</div>';
    stres._h=hits;
    stres.querySelectorAll('[data-add]').forEach(btn=>btn.onclick=()=>{
      const b=stres._h[+btn.dataset.add];
      cfg.stock=cfg.stock||[]; if(!cfg.stock.includes(b.b)) cfg.stock.push(b.b);
      save(); render(); toast(b.b+' added to your shelf');
    });
  });
  s.querySelectorAll('[data-unstock]').forEach(b=>b.onclick=()=>{
    cfg.stock=(cfg.stock||[]).filter(x=>x!==b.dataset.unstock); save(); render();
  });
  s.querySelector('#csv').onclick=showExport;
  s.querySelector('#dict').onclick=showDict;
  const sd=s.querySelector('#seed');
  if(sd) sd.onclick=()=>{ seed(); toast('Demonstration data loaded'); render(); };
  s.querySelector('#clear').onclick=()=>{ tx=[];adverse=[];unresolved=[];cfg.seeded=false;save();render();toast('Records cleared'); };
}

function loadScenario(id){
  const map={s1:['Azixon','resp'],s2:['Acocip','diarr'],s3:['Am-Clav',''],s4:['Refix',''],s5:['Apilox','skin']};
  const [brand,ind]=map[id];
  const hits=lookup(brand);
  if(!hits.length){ toast('Brand not in demo dictionary'); return; }
  tab='counter'; startDraft(hits[0]);
  const d=draft;
  if(id==='s3'){ d.rx=true; d.rxMatch=true; d.qtyMatch='yes'; d.qty=10; d.ageBand='18–44'; }
  else { d.rx=false; d.inds=ind?[ind]:[]; d.qty= id==='s1'?6:10; d.ageBand= id==='s2'?'2–11':'18–44'; }
  if(id==='s2'){ d.redFlags=['rf3']; d.screened=true; }
  render();
}

function csvRows(){
  /* One analysis-ready table. Model terms first, then the outcome and its
     components, then descriptors. No joins needed to fit the primary model.
     Empty cell = not applicable, which read_csv() turns into NA. */
  const cols=[
    'transaction_id','encounter_id','product_seq','pharmacy_id','cluster','step','staff_code',
    'date','time','weekday','hour','period_week','period_month','phase','exposure','days_since_activation',
    'pathway','concordant',
    'c_identified','c_rx_concordant','c_strength','c_form','c_quantity','c_indication','c_screened','c_referred','c_dose','c_duration','c_safetynet','c_safety',
    'components_unassessed','outcome_unscorable',
    'primary_eligible','primary_concordant','primary_unassessed','primary_version',
    'prescription_present','rx_concordant','strength_vs_rx','form_vs_rx','quantity','quantity_vs_rx','indication','indication_count','indication_other','red_flag_screened','red_flags',
    'counsel_dose','counsel_duration','safety_net_advice','referral_given','action','age_band','sex',
    'aware_group','access_group','veterinary','generic','brand_as_entered','strength','form','product_status','provisional_id',
    'high_risk_flags','prompt_ids','entry_seconds','lookup_ms','map_version','prompt_version'];
  const y=v=>v===true?'1':v===false?'0':'';
  const s=v=>v===undefined||v===null?'':String(v);   // yes | no | na | unassessed
  const DAY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const start=cfg.studyStart?new Date(cfg.studyStart+'T00:00:00'):null;
  const act=cfg.activated?new Date(cfg.activated+'T00:00:00'):null;
  const days=(a,b)=>Math.round((a-b)/864e5);
  const rows=tx.map(r=>{
    const c=r.comp||{}, dt=new Date(r.ts);
    return [r.id,r.enc||r.id,r.seq||1,r.ph,r.cluster,cfg.step,r.staff||'',
      r.d,r.ts.slice(11,19),DAY[dt.getDay()],dt.getHours(),
      start?Math.floor(days(dt,start)/7)+1:'', start?(dt.getFullYear()-start.getFullYear())*12+(dt.getMonth()-start.getMonth())+1:'',
      r.phase, r.phase==='advisory'?1:0, act?days(dt,act):'',
      c.pathway||r.path, r.conc===true?1:r.conc===false?0:'',
      s(c.identified),s(c.rxConcordant),s(c.strengthMatched),s(c.formMatched),s(c.quantityAssessed),
      s(c.indicationCaptured),s(c.redFlagScreened),s(c.referredIfFlag),
      s(c.doseGiven),s(c.durationGiven),s(c.safetyNetGiven),s(c.safetyHandled),
      c.nUnass??'', c.anyUnass?1:0,
      (r.prim&&r.prim.eligible)?1:0,
      (r.prim&&r.prim.eligible)?(r.prim.met===true?1:r.prim.met===false?0:''):'',
      (r.prim&&r.prim.eligible)?r.prim.nUnass:'', PRIMARY_VERSION,
      r.rx?1:0,y(r.rxMatch),r.strengthMatch||'',r.formMatch||'',r.qty,r.qtyMatch||'',(r.inds||[]).join('|'),(r.inds||[]).length,r.indOther||'',r.screened?1:0,r.redFlags.join('|'),
      r.counselDose?1:0,r.counselDays?1:0,r.safetyNet?1:0,r.referred?1:0,r.action||'',r.ageBand,r.sex,
      r.aware, r.aware==='Access'?1:0, r.vet?1:0, r.generic,r.brand,r.strength,r.form,
      r.aware==='Unverified'?'provisional':'registered', r.provisionalId||'',
      r.flags.join('|'),r.prompts.join('|'),r.secs,r.lookupMs,VERSIONS.map,VERSIONS.prompts];
  });
  return [cols,...rows];
}
function provRows(){
  return [['provisional_id','brand_as_entered','typed_query','generic_from_pack','strength','form','manufacturer',
           'pharmacy_id','added_at','photo','review_status','resolution','resolved_at'],
    ...provisional.map(v=>[v.id,v.brand,v.typed||'',v.generic,v.strength,v.form,v.mfr,v.shop,v.ts,
      v.photo?'attached':'none',v.status,v.resolution||'',v.resolvedTs||''])];
}
function dayRows(){
  const by={};
  tx.forEach(r=>{ const k=r.ph+'|'+r.d+'|'+r.phase; by[k]=by[k]||{n:0,acc:0,norx:0,conc:0,unres:0,secs:[]};
    const b=by[k]; b.n++; if(r.aware==='Access')b.acc++; if(r.rx===false)b.norx++; if(r.conc===true)b.conc++; if(r.conc===null||r.conc===undefined)b.unscored=(b.unscored||0)+1;
    if(r.unresolved)b.unres++; if(r.secs)b.secs.push(r.secs); });
  const med=a=>a.length?a.slice().sort((x,y)=>x-y)[Math.floor(a.length/2)]:'';
  return [['pharmacy_id','date','phase','transactions','access','no_prescription','concordant','unresolved','median_entry_seconds'],
    ...Object.entries(by).map(([k,b])=>{const [ph,d,phase]=k.split('|');
      return [ph,d,phase,b.n,b.acc,b.norx,b.conc,b.unres,med(b.secs)];})];
}
function promptRows(){
  return [['prompt_id','library_version','title','line_1','line_2'],
    ...Object.entries(PROMPTS).map(([id,v])=>[id,VERSIONS.prompts,v.t,v.b[0]||'',v.b[1]||''])];
}
function advRows(){
  return [['flagged_at','pharmacy_id','product','prompt_ids','note'],
    ...adverse.map(a=>[a.ts,cfg.pharmacyId,a.product,a.prompts,a.note])];
}
function searchRows(){
  return [['searched_at','pharmacy_id','staff_code','phase','query','hits','lookup_ms','outcome'],
    ...searches.filter(x=>x.o!=='typing').map(x=>[x.ts,x.ph,x.staff,x.phase,x.q,x.n,x.ms,x.o])];
}
function download(name, text, mime){
  try{
    const b=new Blob([text],{type:mime+';charset=utf-8'});
    const u=URL.createObjectURL(b), a=document.createElement('a');
    a.href=u; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(u); a.remove();},400);
    toast('Saved '+name);
  }catch(e){ toast('Download blocked \u2014 use Copy instead'); }
}
function toCsv(rows){ return rows.map(r=>r.map(c=>/[",\n]/.test(String(c))?'"'+String(c).replace(/"/g,'""')+'"':c).join(',')).join('\n'); }

function showExport(){
  const sheets=[
    ['transactions', csvRows(), 'analysis',
     'The analysis dataset. One row per antibiotic sale, every model term present as a column — cluster, step, calendar period, exposure, staff, outcome and each concordance component. Fits the primary model with no joins and no reshaping. An empty cell means not applicable and reads as NA.'],
    ['products_added', provRows(), 'reference',
     'One row per product added at a counter, with its review decision. Different unit of observation, so it stays separate — flattening it into the sales table would duplicate rows.'],
    ['prompt_library', promptRows(), 'reference',
     'The exact wording shown, by version. Thirteen rows; repeating this text on every sale would add nothing.'],
    ['adverse_outputs', advRows(), 'audit',
     'Messages staff flagged as wrong or unclear, for the clinical governance group.'],
    ['product_searches', searchRows(), 'analysis',
     'One row per completed lookup, resolved or not. Lookup success and the unresolved-product rate are computed from here \u2014 a search that fails and is abandoned leaves no transaction behind, so the sales table cannot measure them.'],
    ['daily_summary', dayRows(), 'convenience',
     'Pharmacy by day. Derivable from the analysis table in one line of dplyr — included for the data-quality dashboard, not needed for the model.']
  ];
  const RCODE = `library(readr); library(lme4)
d <- read_csv("transactions.csv")

m <- glmer(concordant ~ exposure + factor(period_month) +
             (1 | cluster/pharmacy_id),
           data = d, family = binomial)

# component-level, same shape — c_duration is where the headroom is
glmer(c_duration ~ exposure + factor(period_month) +
        (1 | cluster/pharmacy_id), data = d, family = binomial)`;
  const st=stage();
  st.innerHTML=`<div class="stack">
    <div><h1>End-of-study export</h1>
      <p class="muted" style="margin:4px 0 0">One analysis table. The other four are reference and audit — separate because they count different things, not because the analyst has work left to do.</p></div>
    ${sheets.map(([n,r,kind,d],i)=>`<div class="card"${kind==='analysis'?' style="border-color:var(--accent);border-width:1.5px"':''}>
      <div class="row" style="justify-content:space-between;align-items:flex-start">
        <div style="min-width:0"><div class="row" style="gap:7px"><h3>${n}.csv</h3><span class="pathtag"${kind==='analysis'?' style="background:var(--accent-soft);color:var(--accent)"':''}>${kind}</span></div>
          <p class="muted" style="margin:5px 0 0">${d}</p></div>
        <span class="tiny mono" style="white-space:nowrap;text-align:right">${r.length-1} rows<br>${r[0].length} fields</span>
      </div>
      <div class="row" style="margin-top:10px;gap:8px"><button class="btn sm" data-dl="${i}">Download CSV</button><button class="btn sm" data-copy="${i}">Copy</button></div>
    </div>`).join('')}
    <div class="card">
      <div class="eyebrow">Fits as delivered</div>
      <div class="tablewrap" style="margin-top:8px"><pre class="mono" style="margin:0;font-size:12.5px;line-height:1.55;white-space:pre">${esc(RCODE)}</pre></div>
    </div>
    <div class="row" style="gap:8px"><button class="btn primary wide" id="dlall">Download all five as one backup file</button></div>
    <div class="note">Backup procedure: download the bundle at the end of each working day and hand it to the research team on a USB stick or by the agreed channel. The file is named with the pharmacy code and the date. Records live in this browser only \u2014 clearing browser data erases them, and there is no automatic upload.</div>
    <button class="btn wide" id="bk">Back</button>
  </div>`;
  st.querySelector('#bk').onclick=render;
  st.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{
    const [n,rows]=sheets[+b.dataset.copy];
    try{ await navigator.clipboard.writeText(toCsv(rows)); toast(n+' copied'); }
    catch(e){ toast('Clipboard unavailable'); }
  });
  st.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{
    const [n,rows]=sheets[+b.dataset.dl];
    download(`${cfg.pharmacyId}_${n}_${dstr()}.csv`, toCsv(rows), 'text/csv');
  });
  st.querySelector('#dlall').onclick=()=>{
    // one plain-text bundle: no archive library, nothing to install, opens anywhere
    const parts = sheets.map(([n,rows])=>`### ${n}.csv\n${toCsv(rows)}`);
    const head = `# DC-SST backup\n# pharmacy: ${cfg.pharmacyId}\n# cluster: ${cfg.cluster}\n`
               + `# exported: ${new Date().toISOString()}\n# build: ${BUILD} ${VERSIONS.app}\n`
               + `# sheets: ${sheets.map(s=>s[0]).join(', ')}\n`;
    download(`${cfg.pharmacyId}_dcsst_backup_${dstr()}.txt`, head+'\n'+parts.join('\n\n'), 'text/plain');
    cfg.lastBackup = new Date().toISOString(); save();
  };
}

/* ---- demonstration data: plausible counter traffic, clearly marked ---- */
function seed(){
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const common=BRANDS.filter(b=>/tablet|capsule|syrup/i.test(b.f||''));
  tx=[]; const now=Date.now();
  for(let i=0;i<190;i++){
    const daysAgo=Math.floor(i/6);
    const phase = daysAgo>14 ? 'silent' : 'advisory';
    const b=pick(common), a=awareOf(b.g), g=b.a||(a?a.g:'Unknown');
    const rx=Math.random()<(phase==='advisory'?0.34:0.28);
    const age=pick(AGEBANDS), sex=pick(SEXES);
    const flagged=!rx&&Math.random()<0.1;
    const adv=phase==='advisory';
    const d={brand:b.b,generic:b.g,strength:b.s||'',form:b.f||'tablet',awareGroup:g,rx,
      rxMatch: rx? Math.random()<0.88 : null, qtyMatch: rx? (Math.random()<0.75?'yes':'na') : null,
      qty: Math.random()<(adv?0.78:0.58)?10:5,
      inds: rx?[]:(Math.random()<0.28?[pick(INDICATIONS).id,pick(INDICATIONS).id].filter((v,i,a)=>a.indexOf(v)===i):[pick(INDICATIONS).id]), indOther:'',
      screened: rx?false:(adv?Math.random()<0.82:Math.random()<0.26),
      redFlags: flagged?[pick(REDFLAGS).id]:[], pregnant:false, ageBand:age, sex,
      counselDose: Math.random()<(adv?0.95:0.93),          // the grid is already routine
      counselDays: Math.random()<(adv?0.62:0.24),          // saying the number of days is the real headroom
      safetyNet:   Math.random()<(adv?0.88:0.80),
      referred: flagged?(adv?Math.random()<0.8:Math.random()<0.15):false, action:'dispensed'};
    const p=buildPrompt(d); d.hasStop=p.sev==='stop';
    if(d.hasStop&&adv&&Math.random()<0.55) d.action=Math.random()<0.5?'referred':'changed';
    const c=concordance(d);
    const ts=new Date(now-daysAgo*864e5-Math.random()*36e5).toISOString();
    tx.push({id:'T'+(now-i*97531).toString(36).toUpperCase(),enc:'E'+(now-Math.floor(i/ (Math.random()<0.12?2:1))*97531).toString(36).toUpperCase(),seq:1,d:ts.slice(0,10),ts,ph:cfg.pharmacyId,cluster:cfg.cluster,staff:pick(['S-01','S-02','S-03']),phase,
      brand:d.brand,generic:d.generic,strength:d.strength,strengthMg:parseInt(d.strength)||0,form:d.form,aware:g,
      rx:d.rx,rxMatch:d.rxMatch,qtyMatch:d.qtyMatch,qty:d.qty,inds:d.inds,indOther:'',screened:d.screened,
      redFlags:d.redFlags,askedSymptoms:d.screened,counselDose:d.counselDose,counselDays:d.counselDays,
      safetyNet:d.safetyNet,referred:d.referred,action:d.action,ageBand:age,sex,
      flags:p.flags.map(f=>f.id),prompts:adv?p.ids:[],secs:Math.round((adv?26+Math.random()*22:17+Math.random()*14)*10)/10,
      lookupMs:Math.round((3+Math.random()*9)*10)/10,unresolved:Math.random()<0.045,path:c.pathway,conc:c.met,comp:c,prim:primaryOutcome(d)});
  }
  searches=[];
  tx.forEach(t=>{
    const q=(t.brand||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,7);
    if(q.length>=3) searches.push({ts:t.ts,ph:t.ph,staff:t.staff,phase:t.phase,q,
      n:t.unresolved?0:(1+Math.floor(Math.random()*4)), ms:t.lookupMs, o:t.unresolved?'added-new':(Math.random()<0.06?'resolved-fuzzy':'resolved')});
  });
  tx.sort((a,b)=>b.ts.localeCompare(a.ts));
  unresolved=tx.filter(t=>t.unresolved).slice(0,4).map(t=>({brand:t.brand,ts:t.ts}));
  cfg.seeded=true; save();
}

/* ---- boot ---- */
document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('button[data-tab]'); if(!b) return;
  tab=b.dataset.tab; if(tab!=='counter') draft=null; render();
});
/* Phase assignment belongs to the trial, not to the counter. In the field build the
   phase is computed from the cluster's activation date and the control is inert. */
function phaseFromSchedule(){
  if(!cfg.activated) return 'silent';
  return dstr() >= cfg.activated ? 'advisory' : 'silent';
}
if(FIELD){ cfg.phase = phaseFromSchedule(); }
document.getElementById('phaseBtn').onclick=()=>{
  if(FIELD){ toast('Phase is set by the study schedule'); return; }
  cfg.phase = cfg.phase==='silent'?'advisory':'silent';
  if(cfg.phase==='advisory'&&!cfg.activated) cfg.activated=dstr();
  save(); render(); toast(cfg.phase==='advisory'?'Advisory prompts on':'Recording only');
};
if(!load()){ /* first run */ }
if(!FIELD && !tx.length){ seed(); }   // never in the field build
if(!cfg.studyStart && tx.length){                      // demo: anchor the clock to the seeded traffic
  cfg.studyStart = tx[tx.length-1].d;
  const adv=tx.filter(t=>t.phase==='advisory'); if(adv.length) cfg.activated=adv[adv.length-1].d;
  save();
}
render();
</script>
